name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .app
    # macOS 14+ 的 GitHub 托管 runner 为 Apple Silicon，产出 arm64 包
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 工具链版本
        run: |
          sw_vers
          swift --version

      - name: 单元测试
        run: swift test

      - name: 计算版本号
        id: version
        run: |
          set -euo pipefail
          base=$(./scripts/version.sh)
          short=$(git rev-parse --short=7 HEAD)
          echo "version=$base" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}" >> "$GITHUB_OUTPUT"
          echo "sha=$short" >> "$GITHUB_OUTPUT"
          echo "本次构建：v${base} (${short})"

      - name: 构建 .app
        run: ./scripts/build-app.sh release

      - name: 打包
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/BetterDictation.app dist/BetterDictation-macos-arm64.zip
          shasum -a 256 dist/BetterDictation-macos-arm64.zip \
            | tee dist/BetterDictation-macos-arm64.zip.sha256

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: BetterDictation-macos-arm64-${{ steps.version.outputs.tag }}
          if-no-files-found: error
          path: |
            dist/BetterDictation-macos-arm64.zip
            dist/BetterDictation-macos-arm64.zip.sha256

      # 不再依赖打 tag：分支 push 就会产出 Release，版本号取代码里的 AppVersion.marketing
      - name: 发布 Release（分支 push 触发）
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BetterDictation ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # 同一版本号再次 push 时，更新已有 Release 的资产（overwrite_files 默认 true）
          overwrite_files: true
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/BetterDictation-macos-arm64.zip
            dist/BetterDictation-macos-arm64.zip.sha256
